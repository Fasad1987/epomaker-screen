[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "epomaker-screen"
dynamic = ["version"]
description = "Screens of Epomaker keyboards on Linux (RT82, RT100 Pro, ...): clock sync, pictures and live widgets; KDE Plasma app and CLI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "epomaker-screen contributors" }]
keywords = ["epomaker", "rt82", "rt100", "keyboard", "lcd", "hid", "kde", "plasma"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
# The Qt binding comes from the distribution (python3-module-PyQt6 on ALT,
# python3-pyqt6 on Fedora/Debian) or from one of the extras below.
dependencies = []

[project.optional-dependencies]
pyqt6 = ["PyQt6>=6.2"]
pyside6 = ["PySide6>=6.4"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/Fasad1987/epomaker-screen"
Issues = "https://github.com/Fasad1987/epomaker-screen/issues"

[project.scripts]
epomakerctl = "epomaker_screen.cli:main"

[project.gui-scripts]
epomaker-screen = "epomaker_screen.gui:main"

[tool.setuptools.dynamic]
version = { attr = "epomaker_screen.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
epomaker_screen = ["resources/*.svg"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # long lines are fine where wrapping hurts readability
    "B008",  # default argument calls (dataclass factories)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
